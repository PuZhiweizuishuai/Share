<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据迁移工具</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
      color: #333;
    }
    h2 {
      border-bottom: 2px solid #1976d2;
      padding-bottom: 8px;
      margin-top: 32px;
    }
    .block {
      margin: 16px 0;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 13px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 4px 4px 4px 0;
      font-size: 14px;
    }
    button:hover { background: #1565c0; }
    button.success { background: #43a047; }
    button.success:hover { background: #2e7d32; }
    .tip {
      color: #666;
      font-size: 13px;
      margin: 4px 0;
    }
    #status {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 12px 20px;
      border-radius: 4px;
      color: #fff;
      display: none;
      z-index: 999;
    }
  </style>
</head>

<body>
  <h1>数据迁移工具</h1>
  <p class="tip">用于在 Spring 后端与 Go 后端之间迁移数据。两端的迁移接口结构一致，可互相导入导出。</p>

  <div id="status"></div>

  <h2>全表迁移（推荐）</h2>
  <div class="block">
    <p class="tip">1. 在源后端点击「导出全部」，复制 JSON；2. 在目标后端粘贴 JSON，点击「导入全部」。</p>
    <button class="success" onclick="exportAll()">导出全部数据</button>
    <textarea id="allData" placeholder="将源后端导出的全表 JSON 粘贴到此处，然后点击导入全部"></textarea>
    <br />
    <button onclick="importAll()">导入全部数据</button>
    <p class="tip" id="allTip"></p>
  </div>

  <h2>单表迁移（Share / File）</h2>
  <div class="block">
    <p class="tip">从源后端导出 share 或 file 单表数据，粘贴到目标后端导入。文件需手动拷贝磁盘文件。</p>
    <div>
      <input id="share" placeholder="粘贴 /api/admin/move/share 的 JSON" style="width:70%;padding:8px;" />
      <button onclick="submitShare()">导入 Share</button>
    </div>
    <div style="margin-top:12px;">
      <input id="file" placeholder="粘贴 /api/admin/move/file 的 JSON" style="width:70%;padding:8px;" />
      <button onclick="submitFile()">导入 File</button>
    </div>
  </div>

  <script>
    function showStatus(msg, ok) {
      var el = document.getElementById('status');
      el.textContent = msg;
      el.style.background = ok ? '#43a047' : '#e53935';
      el.style.display = 'block';
      setTimeout(function () { el.style.display = 'none'; }, 3000);
    }

    function exportAll() {
      fetch('/api/admin/move/all', {
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        method: 'GET',
        credentials: 'include'
      }).then(function (r) { return r.json(); })
        .then(function (json) {
          document.getElementById('allData').value = JSON.stringify(json.data, null, 2);
          showStatus('导出成功，请复制上方 JSON', true);
        })
        .catch(function (e) { showStatus('导出失败：' + e, false); });
    }

    function importAll() {
      var raw = document.getElementById('allData').value.trim();
      if (!raw) { showStatus('请先粘贴数据', false); return; }
      var data;
      try { data = JSON.parse(raw); } catch (e) { showStatus('JSON 解析失败：' + e, false); return; }
      fetch('/api/admin/move/all/save', {
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        method: 'POST',
        credentials: 'include',
        body: JSON.stringify(data)
      }).then(function (r) { return r.json(); })
        .then(function (json) {
          if (json.status === 200) {
            showStatus('导入成功', true);
          } else {
            showStatus('导入失败：' + (json.message || ''), false);
          }
        })
        .catch(function (e) { showStatus('导入失败：' + e, false); });
    }

    function submitShare() {
      var raw = document.getElementById('share').value;
      var jsonData = JSON.parse(raw);
      var s = jsonData.share;
      fetch('/api/admin/move/share/save', {
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        method: 'POST',
        body: JSON.stringify(s)
      }).then(function (r) { return r.json(); })
        .then(function (json) { showStatus('Share 导入完成', true); })
        .catch(function (e) { showStatus('导入失败：' + e, false); return null; });
    }

    function submitFile() {
      var raw = document.getElementById('file').value;
      var jsonData = JSON.parse(raw);
      var s = jsonData.file;
      fetch('/api/admin/move/file/save', {
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        method: 'POST',
        body: JSON.stringify(s)
      }).then(function (r) { return r.json(); })
        .then(function (json) { showStatus('File 导入完成', true); })
        .catch(function (e) { showStatus('导入失败：' + e, false); return null; });
    }
  </script>
</body>

</html>
